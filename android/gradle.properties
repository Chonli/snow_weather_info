org.gradle.jvmargs=-Xmx4096M
android.useAndroidX=true
android.enableJetifier=false
android.builtInKotlin=false
android.newDsl=false
# flutter_inappwebview_android 1.1.3 utilise getDefaultProguardFile('proguard-android.txt'),
# non supporte par defaut en AGP 9 (-dontoptimize). A retirer quand le plugin sera corrige.
android.r8.proguardAndroidTxt.disallowed=false
org.gradle.console=verbose
org.gradle.logging.level=info
org.gradle.parallel=true
