name: snow_weather_info
description: A application to display french snow weather beacon informations
publish_to: none

version: 2.6.0+51

environment:
  sdk: '>=3.13.7 <4.0.0'

dependencies:
  archive: ^4.0.7
  collection: any
  csv: ^8.0.0
  dart_mappable: ^4.6.1
  dart_rss:
    git:
      url: https://github.com/Chonli/webfeed.git
      ref: feature/geo-rss-2
  fl_chart: ^1.0.0
  flutter:
    sdk: flutter
  flutter_hooks: ^0.21.2
  flutter_inappwebview: ^6.1.5
  flutter_launcher_icons: ^0.14.3
  flutter_map: ^8.2.2
  flutter_map_marker_cluster_plus: ^1.4.2
  flutter_sticky_header: ^0.8.0
  geolocator: ^14.0.2
  go_router: ^18.1.1
  hooks_riverpod: ^3.1.0
  http: ^1.6.0
  intl: ^0.20.2
  latlong2: ^0.9.0
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  path: ^1.9.1
  path_provider: ^2.1.5
  pdfx: ^2.9.2
  riverpod_annotation: ^4.0.0
  sembast: ^3.8.4
  share_plus: ^13.3.1
  shared_preferences: ^2.5.2
  sliver_tools: ^0.2.12
  smooth_page_indicator: ^3.0.0
  url_launcher: ^6.3.0
dev_dependencies:
  build_runner: ^2.4.15
  custom_lint: ^0.8.0
  dart_mappable_builder: ^4.4.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  riverpod_generator: ^4.0.0+1
  riverpod_lint: ^3.1.0
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/icon/

flutter_icons:
  android: 'launcher_icon'
  ios: true
  image_path: 'assets/icon/icon.png'
